:root{--seed:#0f7b5f;--seed-dark:#4cc3a0;--seed2:#3b6fd9;--seed2-dark:#6f9cf5}
:root[data-palette="ocean"]{--seed:#11639e;--seed-dark:#5ab4ec;--seed2:#7a4bd0;--seed2-dark:#a98bf0}
:root[data-palette="violet"]{--seed:#6b45c6;--seed-dark:#a98bf0;--seed2:#16876b;--seed2-dark:#49c3a2}
:root[data-palette="amber"]{--seed:#a8651a;--seed-dark:#e8a64f;--seed2:#2f7ec4;--seed2-dark:#7bb6ee}
:root[data-palette="rose"]{--seed:#b43a62;--seed-dark:#ef88ab;--seed2:#3b7fb6;--seed2-dark:#86b9e4}
:root[data-palette="slate"]{--seed:#3f5365;--seed-dark:#9db6cb;--seed2:#2e7f73;--seed2-dark:#64bfae}
:root{
  --accent:var(--seed);--accent-ink:#fff;--blue:var(--seed2);
  --bg:color-mix(in srgb,var(--seed) 6%,#f2f4f4);
  --panel:#fff;
  --soft:color-mix(in srgb,var(--seed) 10%,#fff);
  --line:color-mix(in srgb,var(--seed) 13%,#e3e7e6);
  --ink:color-mix(in srgb,var(--seed) 20%,#0d1312);
  --mute:color-mix(in srgb,var(--seed) 16%,#6a7373);
  --a1:var(--seed);
  --a75:color-mix(in srgb,var(--seed) 72%,#fff);
  --a5:color-mix(in srgb,var(--seed) 42%,#fff);
  --a25:color-mix(in srgb,var(--seed) 17%,#fff);
  --a0:color-mix(in srgb,var(--seed) 5%,#edefef);
  --good:#1f9d6b;--warn:#e8912d;--bad:#d9483b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:var(--seed-dark);--accent-ink:#071210;--blue:var(--seed2-dark);
  --bg:color-mix(in srgb,var(--seed-dark) 5%,#0b0f0f);
  --panel:color-mix(in srgb,var(--seed-dark) 7%,#141a19);
  --soft:color-mix(in srgb,var(--seed-dark) 12%,#1b2322);
  --line:color-mix(in srgb,var(--seed-dark) 14%,#263030);
  --ink:color-mix(in srgb,var(--seed-dark) 12%,#eef3f2);

  --a1:color-mix(in srgb,var(--seed-dark) 78%,#000);
  --a75:color-mix(in srgb,var(--seed-dark) 58%,#000);
  --a5:color-mix(in srgb,var(--seed-dark) 40%,#000);
  --a25:color-mix(in srgb,var(--seed-dark) 26%,#000);
  --a0:color-mix(in srgb,var(--seed-dark) 8%,#202928);
  --good:#2fb882;--warn:#e29a3d;--bad:#e5645a;--danger:#f08a7e;
}}
:root[data-theme="dark"]{
  --accent:var(--seed-dark);--accent-ink:#071210;--blue:var(--seed2-dark);
  --bg:color-mix(in srgb,var(--seed-dark) 5%,#0b0f0f);

  --soft:color-mix(in srgb,var(--seed-dark) 12%,#1b2322);

  --a1:color-mix(in srgb,var(--seed-dark) 78%,#000);
  --a75:color-mix(in srgb,var(--seed-dark) 58%,#000);
  --a5:color-mix(in srgb,var(--seed-dark) 40%,#000);

  --good:#2fb882;--warn:#e29a3d;--bad:#e5645a;--danger:#f08a7e;
}

function statSections(K,list,withTabs){

function planStats(){
  const a=A(),pi=curPI(),past=a.pis.filter(p=>p!==pi&&p.start<pi.start).sort((x,y)=>x.start.localeCompare(y.start)),rows=[];
  scopeTeams().forEach(tm=>PLATFORMS.forEach(pl=>{
    const has=tm.members.some(m=>isPlanned(m.role)&&platOf(m.role)===pl),fs=pi.features.filter(f=>f.team===tm.id);
    if(!has&&!fs.some(f=>fpts(f,pl)>0))return;
    const vals=past.map(p=>nvel(p,tm,pl)).filter(v=>v!=null);
    const hist=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:null,tv=tvel(tm,pl),rate=hist!=null?hist:tv,pd=planDays(pi,tm,pl).a,pts=f=>fpts(f,pl);
    rows.push({t:tm,pl,n:vals.length,hist,tv,rate,pd,basis:hist!=null?"history":"default",fc:rate*pd/100,
      committed:fs.filter(f=>f.status==="Committed").reduce((x,f)=>x+pts(f),0),total:fs.reduce((x,f)=>x+pts(f),0)});
  }));
  return {pi,past,rows};

const ftMembers=(tid,pls)=>{const tm=A().teams.find(x=>x.id===tid);return tm?tm.members.filter(m=>isPlanned(m.role)&&pls.includes(platOf(m.role))):[];};

function evenMap(d){
  const out={};
  PLATFORMS.filter(p=>d.platforms.includes(p)).forEach(pl=>{
    const ids=ftMembers(d.team,[pl]).filter(m=>d.who.includes(m.id)).map(m=>m.id),n=ids.length;if(!n)return;
    const base=Math.floor(1000/n)/10;let acc=0;
    ids.forEach((id,i)=>{if(i<n-1){out[id]=base;acc+=base;}else out[id]=Math.round((100-acc)*10)/10;});
  });
  return out;
}
function wsumHtml(){
  const d=ftDraft,rows=[];

    let w=0,any=false;
    ftMembers(d.team,[pl]).filter(m=>d.who.includes(m.id)).forEach(m=>{const n=num(d.wt[m.id]);if(n>0){w+=n;any=true;}});
    if(!any)return;
    w=Math.round(w*10)/10;
    if(w===100)rows.push(`<div class="wsum ok">${pl}: 100% weighted.</div>`);
    else if(w<100)rows.push(`<div class="wsum warn">${pl}: ${n2(w)}% weighted. The remaining ${n2(Math.round((100-w)*10)/10)}% is planned on assigned people without a weight, or on everyone of that platform.</div>`);

function groupChart(cats,series,avgLines){
  if(!cats.length)return "";
  const W=560,H=176,L=32,R=avgLines?44:10,T=14,B=46,iw=W-L-R,ih=H-T-B,n=series.length;

  ${loadHtml?`<div class="fsec" style="margin-top:18px">Load per person ${tip("How much of each person's capacity is planned in each sprint, in story points (SP): planned / capacity. Capacity is their available days × team velocity ÷ 100. Green below 90%, orange from 90%, red when the sprint is fully booked. The Over column shows the part of a person's weighted share that does not fit in this Program Increment, so that feature lands in Beyond this Program Increment.")}</div>${loadHtml}`:""}</div>`;
  return s1+s2+s3+s4;
}
